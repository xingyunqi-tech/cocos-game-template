name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    needs: verify
    if: github.event_name == 'push'
    runs-on: [self-hosted, macOS, cocos-creator]
    defaults:
      run:
        shell: bash
    env:
      WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
      DOUYIN_APPID: ${{ secrets.DOUYIN_APPID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web 冒烟
        run: npm run build -- web --debug && npm run smoke:web -- --screenshot temp/smoke.png
      - name: 三端发布构建与包体检查
        run: |
          if [ -n "$WECHAT_APPID" ] && [ -n "$DOUYIN_APPID" ]; then
            npm run build | tee temp/build-report.txt
          else
            npm run build -- --allow-placeholder-appid | tee temp/build-report.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: |
            build/web-mobile
            build/wechatgame
            build/bytedance-mini-game
            temp/build-report.txt
            temp/smoke.png
            temp/build-logs
