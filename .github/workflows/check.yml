name: Check

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  smoke:
    name: Web Smoke
    needs: verify
    if: github.event_name != 'pull_request' && vars.COCOS_RUNNER == 'true'
    runs-on: [self-hosted, macOS, cocos-creator]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Web 调试构建与冒烟
        run: npm run build -- web --debug && npm run smoke:web -- --screenshot temp/smoke.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ github.sha }}
          path: |
            temp/smoke.png
            temp/build-logs
          if-no-files-found: ignore
